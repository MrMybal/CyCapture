name: Documentation Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out CyCapture
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out the pinned CyDoc source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: MrMybal/CyDoc
          ref: 774f2a7eabf7dd181a98ffc5add115b580b67f42
          token: ${{ secrets.CYDOC_REPOSITORY_TOKEN }}
          path: .cydoc-source
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            .cydoc-source/package-lock.json
            docs/cydoc/package-lock.json

      - name: Pack the pinned CyDoc version
        working-directory: .cydoc-source
        run: |
          npm ci --no-audit --no-fund
          mkdir -p "$GITHUB_WORKSPACE/docs/cydoc/vendor"
          npm pack --pack-destination "$GITHUB_WORKSPACE/docs/cydoc/vendor"

      - name: Generate and check the complete documentation export
        working-directory: docs/cydoc
        run: |
          npm ci --no-audit --no-fund
          npm run check

      - name: Verify links, translations and local resources
        run: node scripts/verify-documentation.mjs docs/cydoc/.output/help docs/cydoc/cydoc.config.json

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          enablement: true
          token: ${{ secrets.CYDOC_REPOSITORY_TOKEN }}

      - name: Upload only the CyDoc export
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/cydoc/.output/help

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
